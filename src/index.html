<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<title>כוכב התנ״ך · חן התנ״ך</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 64 64&quot;><circle cx=&quot;32&quot; cy=&quot;32&quot; r=&quot;31&quot; fill=&quot;#fff&quot;/><path transform=&quot;rotate(0 32 32)&quot; d=&quot;M32 32 L26.2 18.6 L32 5.2 L37.8 18.6 Z&quot; fill=&quot;#e63a35&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.4&quot; stroke-linejoin=&quot;round&quot;/><path transform=&quot;rotate(60 32 32)&quot; d=&quot;M32 32 L26.2 18.6 L32 5.2 L37.8 18.6 Z&quot; fill=&quot;#3db54a&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.4&quot; stroke-linejoin=&quot;round&quot;/><path transform=&quot;rotate(120 32 32)&quot; d=&quot;M32 32 L26.2 18.6 L32 5.2 L37.8 18.6 Z&quot; fill=&quot;#ec4f9c&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.4&quot; stroke-linejoin=&quot;round&quot;/><path transform=&quot;rotate(180 32 32)&quot; d=&quot;M32 32 L26.2 18.6 L32 5.2 L37.8 18.6 Z&quot; fill=&quot;#17b8c4&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.4&quot; stroke-linejoin=&quot;round&quot;/><path transform=&quot;rotate(240 32 32)&quot; d=&quot;M32 32 L26.2 18.6 L32 5.2 L37.8 18.6 Z&quot; fill=&quot;#f7941d&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.4&quot; stroke-linejoin=&quot;round&quot;/><path transform=&quot;rotate(300 32 32)&quot; d=&quot;M32 32 L26.2 18.6 L32 5.2 L37.8 18.6 Z&quot; fill=&quot;#2a6fd6&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.4&quot; stroke-linejoin=&quot;round&quot;/></svg>">
<style>/*@FONTS@*/</style>
<style>/*@CSS@*/</style>
</head>
<body class="booting">
  <!-- Full-window background (fills letterbox areas too) -->
  <div id="bg" aria-hidden="true">
    <div class="bg-grad"></div>
    <div class="bg-rays"><div class="rays rays-a"></div><div class="rays rays-b"></div></div>
    <div class="bg-text"></div>
    <canvas id="bg-canvas"></canvas>
    <div class="bg-horizon"></div>
    <div class="bg-skyline"><div class="sky-back"></div><div class="sky-front"></div></div>
    <div class="bg-vignette"></div>
  </div>

  <!-- 1920×1080 stage, scaled to fit with 16:9 letterbox -->
  <div id="viewport">
    <main id="stage" aria-live="polite">
      <section class="screen" id="scr-splash" data-screen="splash"></section>
      <section class="screen" id="scr-board" data-screen="board"></section>
      <section class="screen" id="scr-play" data-screen="play"></section>
      <section class="screen" id="scr-result" data-screen="result"></section>
      <nav id="dock" aria-label="כלים"></nav>
      <div id="layer-modal"></div>
      <div id="layer-toast"></div>
    </main>
  </div>

  <!-- Particles (confetti, sparkles, dissolve) above everything in the game -->
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- Admin / CMS (light, responsive, not scaled) -->
  <div id="admin" hidden></div>

  <div id="rotate-hint" role="dialog" aria-label="סובבו את המכשיר">
    <div class="rh-card">
      <svg class="rh-ic" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="20" y="6" width="24" height="42" rx="4"/><path d="M29 41h6"/><path d="M10 40a24 24 0 0 0 20 18" /><path d="M24 54l6 4-4 6"/></svg>
      <b>לחוויה המלאה — סובבו את המכשיר לרוחב</b>
      <span>המשחק מעוצב למסך גדול ולמקרן (16:9)</span>
      <button type="button" class="btn btn-gold" onclick="document.body.classList.add('rh-dismissed')">המשך בכל זאת</button>
    </div>
  </div>
  <div id="curtain" aria-hidden="true"></div>
<!--@SCRIPTS@-->
</body>
</html>
